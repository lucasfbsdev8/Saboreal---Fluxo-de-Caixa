<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SABOREAL</title>
    <link rel="icon" href="imagens/icone.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-container">
    <div class="banner-container">
        <div class="brand-header-left">
            <img src="imagens/logoEscrita.png" alt="SABOREAL Biscoitos Caseiros" class="logo-escrita-img">
        </div>
        <div class="system-title-bottom">Sistema de gestão</div>
    </div>

    <div class="form-side">
        <div class="form-content">
            <img src="imagens/logo.png" alt="" class="chef-hat-icon">
            <h1 class="welcome-title">Bem-vindo!</h1>

            <form id="form-login">
                <div class="input-group-proto">
                    <label for="usuario" class="sr-only">Usuário</label>
                    <span class="input-icon" aria-hidden="true">👤</span>
                    <input type="text" id="usuario" placeholder="Usuário" autocomplete="username" required autofocus>
                </div>
                <div class="input-group-proto">
                    <label for="senha" class="sr-only">Senha</label>
                    <span class="input-icon" aria-hidden="true">🔒</span>
                    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login-proto">Entrar</button>
            </form>
        </div>
    </div>
</div>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
