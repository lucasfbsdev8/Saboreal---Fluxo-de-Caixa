<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Início - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/icone.png">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div class="top-bar">
                <h2>Início</h2>
                <div class="user-info"><svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg> <span id="lbl-usuario">Gerência</span></div>
            </div>
            <div class="page-body">
                <p style="margin-bottom: 20px;">Olá, aqui está o resumo de hoje.</p>
                <div class="cards-grid">
                    <div class="metric-card">
                        <h4>Faturamento hoje</h4>
                        <div class="value" id="val-faturamento">R$ 0,00</div>
                        <div class="subtext">em relação a ontem</div>
                    </div>
                    <div class="metric-card">
                        <h4>Vendas hoje</h4>
                        <div class="value" id="val-vendas">0 vendas</div>
                        <div class="subtext" style="color: #D9534F;">em relação a ontem</div>
                    </div>
                    <div class="metric-card">
                        <h4>Dinheiro em caixa</h4>
                        <div class="value" id="val-caixa">R$ 0,00</div>
                        <div class="subtext">em relação ao mês passado</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const res = await apiRequest('/dashboard/resumo');
            if (res) {
                document.getElementById('val-faturamento').textContent = `R$ ${res.faturamento_hoje.toFixed(2)}`;
                document.getElementById('val-vendas').textContent = `${res.vendas_hoje} vendas`;
                document.getElementById('val-caixa').textContent = `R$ ${res.dinheiro_caixa.toFixed(2)}`;
            }
        });
    </script>
</body>
</html>
