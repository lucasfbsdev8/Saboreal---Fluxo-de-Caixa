<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela vendas</title>

  <style>
    body {
      margin: 0;
      font-family: arial, sans-serif;
    }

    .principal {
        display: flex;
        width: 100%
    }

    /* A barra marrom */
    .menu {
      background-color: #5D4D3F;
      color: #E9E9E9;
      width: 20%;          /* largura da barra */
      height: 100vh;         /* ocupa a altura toda da tela */
      padding: 15px;
      box-sizing: border-box;
      position: relative;    /* necessário para o "Sair" ficar embaixo */
    }

    /* Nome da padaria */
    .logo {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    .logo small {
      display: block;
      font-size: 10px;
    }

    /* Cada botão do menu */
    .menu a {
      display: block;
      color: #E9E9E9;
      text-decoration: none;  
      padding: 20px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 16px;
    }

    /* Botão da página atual (vermelho) */
    .menu a.ativo {
      background-color: #E11212;
    }

    /* Muda a cor quando passa o mouse */
    .menu a:hover {
      background-color: #B4AF96;
    }

    /* Botão Sair: fica no fim da barra */
    .menu a.sair {
      position: absolute;
      bottom: 15px;    
      left: 15px;
      right: 15px;
    }

    /* Fundo resto da tela */
    .fundo {
      background-color: #EBEBEB;
      color:black;
      width: 80%;         
      height: 100vh;        
      padding: 15px;
      box-sizing: border-box;
      position: relative;  
    }
  </style>
</head>
<body>
  <div class="principal">
    <div class="menu">

        <div class="logo">
        SABOREAL
        <small>BISCOITOS CASEIROS</small>
        </div>

        <a href="#">🏠 Início</a>
        <a href="#">💰 Caixa</a>
        <a href="#" class="ativo">🛒 Vendas</a>
        <a href="#">📝 Cadastro</a>
        <a href="#">📦 Relatórios</a>

        <a href="#" class="sair">➡️ Sair</a>

    </div>
    <div class="fundo">
        OI
    </div>
  </div>
</body>
</html>
