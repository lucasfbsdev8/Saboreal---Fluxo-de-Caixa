<!-- vendas.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vendas - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pdv-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .total-display { background: #3E2723; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.8rem; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div class="top-bar">
                <h2>Vendas</h2>
                <div class="user-info">👤 Gerência</div>
            </div>
            <div class="page-body">
                <div class="pdv-layout">
                    <div>
                        <div class="card-panel">
                            <h3>F2 - Adicionar Item</h3>
                            <div style="display: flex; gap: 10px; margin-top: 10px;">
                                <select id="sel-produto" class="form-control"></select>
                                <input type="number" id="inp-qtd" class="form-control" value="1" min="1" style="width: 80px;">
                                <button id="btn-add" class="btn-primary">Enter</button>
                            </div>
                        </div>

                        <table class="table-custom">
                            <thead>
                                <tr><th>CÓD</th><th>PRODUTO</th><th>QNTD</th><th>VALOR</th></tr>
                            </thead>
                            <tbody id="tb-carrinho"></tbody>
                        </table>
                    </div>

                    <div class="card-panel">
                        <h3>Pagamento</h3>
                        <div class="form-group" style="margin-top: 15px;">
                            <label>Forma de Pagamento:</label>
                            <select id="sel-forma" class="form-control">
                                <option value="Dinheiro">Dinheiro</option>
                                <option value="PIX">PIX</option>
                                <option value="Crédito">Crédito</option>
                                <option value="Débito">Débito</option>
                            </select>
                        </div>

                        <div class="total-display">
                            <small style="font-size:0.9rem; display:block;">Total</small>
                            R$ <span id="lbl-total">0.00</span>
                        </div>

                        <button id="btn-finalizar" class="btn-primary" style="width: 100%; padding: 12px;">Finalizar Venda</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="sidebar.js"></script>
    <script src="vendas.js"></script>
</body>
</html>
