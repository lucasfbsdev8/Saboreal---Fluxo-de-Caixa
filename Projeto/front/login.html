<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #4A3525; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background-color: #B5A992; padding: 35px; border-radius: 12px; width: 300px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 45px;">👨‍🍳</div>
        <h1 style="color:#FFF;">SABOREAL</h1>
        <p style="color:#FFF; font-size: 0.75rem; margin-bottom: 15px;">BISCOITOS CASEIROS</p>
        <p style="font-weight: bold; margin-bottom: 15px;">Sistema de gestão<br>Bem vindo!</p>
        <form id="form-login">
            <div class="form-group" style="text-align: left;">
                <label>Usuário:</label>
                <input type="text" id="usuario" class="form-control" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Senha:</label>
                <input type="password" id="senha" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
        </form>
    </div>

    <script src="api.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await apiRequest('/login', 'POST', {
                usuario: document.getElementById('usuario').value,
                senha: document.getElementById('senha').value
            });
            if (res && res.sucesso) {
                localStorage.setItem('usuario', res.usuario);
                window.location.href = 'inicio.html';
            }
        });
    </script>
</body>
</html>
