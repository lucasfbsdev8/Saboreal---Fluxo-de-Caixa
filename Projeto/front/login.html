<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Saboreal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/icone.png">
</head>
<body>
    <div class="login">

    <section class="login-foto">
      <img class="login-escrita" src="imagens/logoEscrita.png" alt="Saboreal Biscoitos Caseiros">
      <h2 class="login-subtitulo">Sistema de gestão</h2>
    </section>
 
    <main class="login-painel">
      <h1 class="login-titulo">Bem-vindo!</h1>
      <img class="login-logo" src="imagens/logo.png" alt="Logo - Saboreal Biscoitos Caseiros">
 
      <!-- provisório: ao enviar, vai para o início. Depois será trocado pelo envio ao Flask -->
      <form class="login-form" onsubmit="location.href='inicio.html'; return false;">
        <div class="login-campo">
          <svg class="icone" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="usuario" name="usuario" placeholder="Usuário" aria-label="Usuário" autocomplete="username" required>
        </div>
 
        <div class="login-campo">
          <svg class="icone" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="senha" name="senha" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
        </div>
 
        <button type="submit" class="login-botao">Login</button>
      </form>
    </main>
 
  </div>
</body>
</html>
