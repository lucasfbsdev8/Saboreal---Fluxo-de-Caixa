<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Caixa - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/icone.png">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div class="top-bar">
                <h2 id="titulo-pagina">ABRIR CAIXA</h2>
                <div class="user-info"><svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg> Gerência</div>
            </div>
            <div class="page-body">
                
                <!-- Secao: Abrir Caixa -->
                <div id="secao-abrir" class="card-panel" style="max-width: 450px; margin: 0 auto; display:none;">
                    <form id="form-abrir">
                        <div class="form-group">
                            <label>Operador</label>
                            <input type="text" id="abrir-operador" class="form-control" value="Gerência" readonly>
                        </div>
                        <div class="form-group">
                            <label>Valor em caixa (R$)</label>
                            <input type="number" step="0.01" id="abrir-valor" class="form-control" value="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Observações (opcional)</label>
                            <input type="text" id="abrir-obs" class="form-control" placeholder="Ex: troco reforçado hoje">
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Abrir caixa</button>
                    </form>
                </div>

                <!-- Secao: Fechar Caixa -->
                <div id="secao-fechar" class="card-panel" style="max-width: 500px; margin: 0 auto; display:none;">
                    <h3>Fechamento de caixa</h3>
                    <form id="form-fechar" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Valor total contado no caixa (R$)</label>
                            <input type="number" step="0.01" id="fechar-valor" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Observação:</label>
                            <input type="text" id="fechar-obs" class="form-control" placeholder="R$ 0,00">
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Confirmar fechamento</button>
                    </form>
                </div>

                <!-- Secao: Registrar Saida -->
                <div id="secao-saida" class="card-panel" style="max-width: 500px; margin: 0 auto; display: none;">
                    <h3>REGISTRAR SAÍDA</h3>
                    <form id="form-saida" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Categoria</label>
                            <select id="saida-categoria" class="form-control">
                                <option>Despesa com produtos (insumos)</option>
                                <option>Despesas administrativas</option>
                                <option>Despesas operacionais</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Descrição</label>
                            <input type="text" id="saida-descricao" class="form-control" placeholder="Ex: Compra de farinha">
                        </div>
                        <div class="form-group">
                            <label>Valor (R$)</label>
                            <input type="number" step="0.01" id="saida-valor" class="form-control" placeholder="R$ 0,00" required>
                        </div>
                        <div class="form-group">
                            <label>Forma de pagamento</label>
                            <select id="saida-forma" class="form-control">
                                <option>Dinheiro</option>
                                <option>PIX</option>
                                <option>Cartão</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Retirado de:</label>
                            <input type="text" id="saida-origem" class="form-control" value="Caixa" readonly>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Registrar saída</button>
                    </form>
                </div>

                <!-- Secao: Fluxo de Caixa -->
                <div id="secao-fluxo" class="card-panel" style="display: none;">
                    <h3>Fluxo de caixa (Abril a setembro de 2026)</h3>
                    <div style="overflow-x: auto; margin-top: 15px;">
                        <table class="table-custom">
                            <thead>
                                <tr id="tr-header-fluxo">
                                    <th>Fluxo de caixa</th>
                                </tr>
                            </thead>
                            <tbody id="tb-body-fluxo">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="sidebar.js"></script>
    <script src="caixa.js"></script>
</body>
</html>
