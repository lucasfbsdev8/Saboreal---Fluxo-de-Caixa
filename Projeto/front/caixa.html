<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - SABOREAL</title>
    <link rel="icon" href="imagens/icone.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <header class="top-bar"><h2 id="titulo-pagina">Caixa</h2></header>
        <div class="page-body">

            <!-- Abrir caixa -->
            <section id="secao-abrir" class="card-panel form-narrow" hidden>
                <form id="form-abrir">
                    <div class="saldo-destaque">
                        <span class="rotulo">Saldo atual em caixa (dinheiro)</span>
                        <strong id="lbl-saldo-abertura">R$ 0,00</strong>
                    </div>
                    <button type="submit" class="btn-success btn-block">Abrir caixa</button>
                </form>
            </section>
            <!-- Fechar caixa -->
            <section id="secao-fechar" class="card-panel form-narrow" hidden>
                <div class="resumo-linhas">
                    <div class="linha"><span>Valor na abertura</span><span id="lbl-fechar-abertura">R$ 0,00</span></div>
                    <div class="linha"><span>Vendas em dinheiro</span><span id="lbl-fechar-vendas" class="pos">R$ 0,00</span></div>
                    <div class="linha"><span>Saídas em dinheiro</span><span id="lbl-fechar-saidas" class="neg">R$ 0,00</span></div>
                    <div class="linha"><span>Esperado na gaveta</span><span id="lbl-fechar-esperado">R$ 0,00</span></div>
                </div>
                <p class="dica">Saldo em banco (PIX e cartões): <strong id="lbl-fechar-banco">R$ 0,00</strong>. Não entra na contagem da gaveta.</p>
                <form id="form-fechar">
                    <div class="form-group">
                        <label for="fechar-valor">Valor contado na gaveta</label>
                        <input type="text" id="fechar-valor" class="form-control" data-moeda inputmode="numeric" autocomplete="off" required>
                        <div id="lbl-divergencia" class="divergencia-badge" hidden></div>
                    </div>
                    <div class="form-group">
                        <label for="fechar-obs">Observação</label>
                        <input type="text" id="fechar-obs" class="form-control" maxlength="200" placeholder="Ex.: justificativa de divergência">
                    </div>
                    <button type="submit" class="btn-primary btn-block">Fechar caixa</button>
                </form>
            </section>

            <!-- Registrar saída -->
            <section id="secao-saida" class="card-panel form-narrow" hidden>
                <p class="dica">Dinheiro disponível na gaveta: <strong id="lbl-saldo-saida">R$ 0,00</strong></p>
                <form id="form-saida">
                    <div class="form-group">
                        <label for="saida-categoria">Categoria</label>
                        <select id="saida-categoria" class="form-control">
                            <option>Despesa com produtos (insumos)</option>
                            <option>Despesas administrativas</option>
                            <option>Despesas operacionais</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="saida-descricao">Descrição</label>
                        <input type="text" id="saida-descricao" class="form-control" maxlength="200" placeholder="Ex.: compra de farinha">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="saida-valor">Valor</label>
                            <input type="text" id="saida-valor" class="form-control" data-moeda inputmode="numeric" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="saida-forma">Pago com</label>
                            <select id="saida-forma" class="form-control">
                                <option>Dinheiro</option>
                                <option>PIX</option>
                                <option>Cartão</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-block">Registrar saída</button>
                </form>
            </section>

        </div>
    </main>
</div>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/caixa.js"></script>
</body>
</html>
