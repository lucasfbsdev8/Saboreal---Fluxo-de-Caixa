<!-- caixa.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Caixa - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div class="top-bar">
                <h2 id="titulo-pagina">ABRIR CAIXA</h2>
                <div class="user-info">👤 Gerência</div>
            </div>
            <div class="page-body">
                
                <div id="secao-abrir" class="card-panel" style="max-width: 450px; margin: 0 auto; display:none;">
                    <form id="form-abrir">
                        <div class="form-group">
                            <label>Operador</label>
                            <input type="text" id="abrir-operador" class="form-control" value="Gerência" readonly>
                        </div>
                        <div class="form-group">
                            <label>Valor em caixa (R$)</label>
                            <input type="number" step="0.01" id="abrir-valor" class="form-control" value="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Observações (opcional)</label>
                            <input type="text" id="abrir-obs" class="form-control" placeholder="Ex: troco reforçado hoje">
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Abrir caixa</button>
                    </form>
                </div>

                <div id="secao-fechar" class="card-panel" style="max-width: 500px; margin: 0 auto; display:none;">
                    <h3>Fechamento de caixa</h3>
                    <form id="form-fechar" style="margin-top: 15px;">
                        <div class="form-group">
                            <label>Valor total contado no caixa (R$)</label>
                            <input type="number" step="0.01" id="fechar-valor" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Observação:</label>
                            <input type="text" id="fechar-obs" class="form-control" placeholder="R$ 0,00">
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%;">Confirmar fechamento</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="sidebar.js"></script>
    <script src="caixa.js"></script>
</body>
</html>
