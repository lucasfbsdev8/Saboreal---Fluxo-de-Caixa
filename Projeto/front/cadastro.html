<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos - SABOREAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div class="top-bar">
                <h2>Cadastro de produtos</h2>
                <div class="user-info">👤 Gerência</div>
            </div>
            <div class="page-body">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                    <div>
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Cód.</th>
                                    <th>Produto</th>
                                    <th>Categoria</th>
                                    <th>Preço</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tb-produtos"></tbody>
                        </table>
                    </div>

                    <div class="card-panel">
                        <h3 id="form-titulo">Novo produto</h3>
                        <form id="form-produto" style="margin-top: 10px;">
                            <div class="form-group">
                                <label>Código (Automático)</label>
                                <input type="text" id="p-cod" class="form-control" readonly style="background-color: #E0E0E0; font-weight: bold;">
                            </div>
                            <div class="form-group"><label>Nome</label><input type="text" id="p-nome" class="form-control" required></div>
                            <div class="form-group"><label>Categoria</label><input type="text" id="p-cat" class="form-control" required></div>
                            <div class="form-group"><label>Preço de venda (R\$)</label><input type="number" step="0.01" id="p-preco" class="form-control" required></div>
                            <div class="form-group" id="box-estoque-inicial">
                                <label>Estoque Inicial</label>
                                <input type="number" id="p-estoque" class="form-control" value="0">
                            </div>
                            <button type="submit" class="btn-primary" id="btn-salvar-prod" style="width: 100%;">Salvar produto</button>
                            <button type="button" class="btn-primary" id="btn-cancelar-edit" style="width: 100%; margin-top: 8px; background-color: #757575; display: none;" onclick="resetarFormulario()">Cancelar Edição</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="sidebar.js"></script>
    <script>
        let produtosCache = [];
        let modoEdicao = false;

        async function carregarProdutos() {
            const res = await apiRequest('/produtos') || { produtos: [], proximo_codigo: '01' };
            produtosCache = res.produtos;
            
            const tbody = document.getElementById('tb-produtos');
            tbody.innerHTML = '';
            produtosCache.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${p.codigo}</strong></td>
                        <td>${p.nome}</td>
                        <td>${p.categoria}</td>
                        <td>R$ ${p.preco_venda.toFixed(2)}</td>
                        <td>
                            <button class="btn-primary" style="padding: 4px 10px; font-size: 0.8rem; background-color: #8D6E63;" onclick="prepararEdicao('${p.codigo}')">✏️ Editar</button>
                        </td>
                    </tr>
                `;
            });

            if (!modoEdicao) {
                document.getElementById('p-cod').value = res.proximo_codigo;
            }
        }

        function prepararEdicao(codigo) {
            const prod = produtosCache.find(p => p.codigo === codigo);
            if (!prod) return;

            modoEdicao = true;
            document.getElementById('form-titulo').textContent = `Editar Produto (${prod.codigo})`;
            document.getElementById('p-cod').value = prod.codigo;
            document.getElementById('p-nome').value = prod.nome;
            document.getElementById('p-cat').value = prod.categoria;
            document.getElementById('p-preco').value = prod.preco_venda;
            
            document.getElementById('box-estoque-inicial').style.display = 'none';
            document.getElementById('btn-salvar-prod').textContent = 'Atualizar produto';
            document.getElementById('btn-cancelar-edit').style.display = 'block';
        }

        function resetarFormulario() {
            modoEdicao = false;
            document.getElementById('form-titulo').textContent = 'Novo produto';
            document.getElementById('form-produto').reset();
            document.getElementById('box-estoque-inicial').style.display = 'block';
            document.getElementById('btn-salvar-prod').textContent = 'Salvar produto';
            document.getElementById('btn-cancelar-edit').style.display = 'none';
            carregarProdutos();
        }

        document.getElementById('form-produto').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (modoEdicao) {
                const res = await apiRequest('/produtos', 'PUT', {
                    codigo: document.getElementById('p-cod').value,
                    nome: document.getElementById('p-nome').value,
                    categoria: document.getElementById('p-cat').value,
                    preco_venda: parseFloat(document.getElementById('p-preco').value)
                });
                if (res && res.sucesso) {
                    alert('Produto atualizado com sucesso!');
                    resetarFormulario();
                }
            } else {
                const res = await apiRequest('/produtos', 'POST', {
                    codigo: document.getElementById('p-cod').value,
                    nome: document.getElementById('p-nome').value,
                    categoria: document.getElementById('p-cat').value,
                    preco_venda: parseFloat(document.getElementById('p-preco').value),
                    estoque: parseInt(document.getElementById('p-estoque').value) || 0
                });
                if (res && res.sucesso) {
                    alert('Produto cadastrado com sucesso!');
                    resetarFormulario();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
</body>
</html>
